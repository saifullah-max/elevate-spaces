<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>Offline - Elevate Spaces</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }

        .offline-container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }

        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            opacity: 0.95;
            line-height: 1.6;
        }

        .offline-details {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-top: 2rem;
            backdrop-filter: blur(10px);
        }

        .offline-details h2 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            opacity: 0.9;
        }

        ul {
            text-align: left;
            list-style: none;
            margin-top: 1rem;
        }

        li {
            padding: 0.5rem 0;
            opacity: 0.9;
            display: flex;
            align-items: center;
        }

        li:before {
            content: "✓";
            margin-right: 0.75rem;
            font-weight: bold;
        }

        .offline-actions {
            margin-top: 2rem;
        }

        button {
            background: #fff;
            color: #6366f1;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .offline-container {
                padding: 1rem;
            }

            .offline-icon {
                font-size: 3rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
            }

            button {
                width: 100%;
                padding: 0.75rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection.</p>

        <div class="offline-details">
            <h2>Cached content you can still access:</h2>
            <ul>
                <li>Previous staging results</li>
                <li>Your upload history</li>
                <li>App navigation</li>
            </ul>
        </div>

        <div class="offline-actions">
            <button onclick="location.href='/'">Go Home</button>
            <button onclick="location.reload()">Try Again</button>
        </div>

        <p style="margin-top: 2rem; font-size: 0.9rem; opacity: 0.7;">
            Once your connection is restored, you'll be able to upload new images and access all features.
        </p>
    </div>
</body>
</html>
